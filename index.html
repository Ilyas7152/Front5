<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 5</title>
</head>
<body>

  <h1>Assignment #5 — JavaScript DOM</h1>

  <section>
    <h2>Part 1: User Profile</h2>
    <div id="profile-display"></div>
  </section>

  <section>
    <h2>Part 2: Update Profile</h2>
    <input type="text" id="username-input" placeholder="Username">
    <input type="number" id="birthyear-input" placeholder="Birth Year">
    <button id="submit-btn">Create / Update Profile</button>
  </section>

  <section>
    <h2>Part 3: Hobbies List</h2>
    <input type="text" id="item-input" placeholder="New hobby or task">
    <button id="add-btn">Add Item</button>
    <button id="remove-btn">Remove Item</button>
    
    <ul id="hobby-list">
      <li>coding</li>
      <li>gaming</li>
      <li>reading</li>
    </ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
